<form novalidate [formGroup]="validateForm" (ngSubmit)="submitForm()">
  <div class="form-group">
    <label>{{'management.modelId' | translate}}</label>
    <input readonly class="form-control" name="modelId" formControlName="modelId">
  </div>
  <div class="form-group mb-1">
    <label>{{'management.modelName' | translate}}</label>
    <input class="form-control" name="name" formControlName="name"
      [placeholder]="'management.modelPlaceholder' | translate"
      >
    @if (validateForm.controls['name'].invalid && validateForm.controls['name'].dirty) {
      <li>
        {{'management.modelLength' | translate}}
      </li>
    }
  </div>
  <div class="form-group mb-1">
    <label>{{'management.modelValue' | translate}}</label>
    <input class="form-control" name="name" formControlName="modelValue"
           [placeholder]="'management.valuePlaceholder' | translate"
    >
    @if (validateForm.controls['modelValue'].invalid && validateForm.controls['modelValue'].dirty) {
      <li>
        {{'management.modelLength' | translate}}
      </li>
    }
  </div>
  <div class="form-group mb-1">
    <label class="me-2">{{'management.supportsImages' | translate}}</label>
    <input type="checkbox" formControlName="vision">
  </div>
  <div class="form-group mb-1">
    <label class="me-2">{{'management.isChatModel' | translate}}</label>
    <input type="checkbox" formControlName="isChatModel">
  </div>
  <div class="d-flex flex-row-reverse">
    <button class="btn btn-primary" type="submit">{{'management.change' | translate}}</button>
  </div>
</form>
