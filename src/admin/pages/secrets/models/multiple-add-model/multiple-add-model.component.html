<div class="d-flex flex-row-reverse m-1">
  <button nz-button (click)="selectAll()">{{'management.selectAll' | translate}}</button>
</div>
<table class="table table-sm table-bordered">
  <thead>
  <tr>
    <td>{{'management.select' | translate}}</td>
    <td>{{'management.modelName' | translate}}</td>
    <td>{{'management.modelValue' | translate}}</td>
    <td>{{'management.includesVision' | translate}}</td>
    <td>{{'management.chatModel' | translate}}</td>

  </tr>
  </thead>
  <tbody>
    @for(model of availableModels;track model){
      <tr>
        <td><input type="checkbox" [disabled]="alreadyExist(model)" [(ngModel)]="selects[$index]" ></td>
        <td>{{model.name}}</td>
        <td>{{model.modelValue}}</td>
        <td><input type="checkbox" [(ngModel)]="model.vision" ></td>
        <td><input type="checkbox" [(ngModel)]="model.isChatModel" ></td>
      </tr>
    }
  </tbody>

</table>
<div class="d-flex flex-row-reverse">
  <button nz-button (click)="addModels()">{{'management.add' | translate}}</button>
</div>
