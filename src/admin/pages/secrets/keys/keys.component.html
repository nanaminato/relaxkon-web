<div class="overflow-y-scroll h-100">
  <div class="d-flex flex-row-reverse sticky-top z-1 bg-white">
    <div class="list-heading"><h2>{{'management.keys' | translate}}</h2><p>{{'workspace.keysDescription' | translate}}</p></div>
    <div class="my-1">
      <button class="btn btn-primary mx-1" [routerLink]="['create']" [queryParams]="{returnUrl: admin_routes.keys.join('/')}">{{'management.add' | translate}}</button>
      <button class="btn btn-primary mx-1"
              (click)="refresh()"
      >{{'management.refresh' | translate}}</button>
      <button class="btn btn-primary mx-1"
        (click)="loadIntoRunPool()"
        >
        {{'management.loadPool' | translate}}
      </button>
    </div>
  </div>
  @if(keys===undefined||keys!.length===0){
    <div class="admin-empty">{{'workspace.keysEmpty' | translate}}</div>
  }@else{
    @for(key of keys!; track key.supplierKeyId){
      <app-key-exhibit (refresh)="refresh()" [key]="key"></app-key-exhibit>
    }
  }

</div>
