<nz-card class="super-b overflow-y-scroll h-100 w-100">

  <div class="d-flex flex-row-reverse">
    <button class="btn btn-primary"
            (click)="logout()">
      {{'admin.management.logout' | translate}}
    </button>
  </div>
  <div class="m-1 fs-u">
    {{'admin.management.username' | translate}}:  {{user?.name}}
  </div>
  <div class="m-1 fs-u">
    {{'admin.management.nickname' | translate}}:  {{user?.nickname ?? ('admin.management.none' | translate)}}
  </div>
  <div class="m-1 fs-u">
    {{'admin.management.roles' | translate}}:
    @if(user!==undefined){
      @for(role of user!.roles;track role.roleId){
        {{role.name}}
      }
    }
  </div>
</nz-card>
