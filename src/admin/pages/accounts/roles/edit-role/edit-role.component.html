<form [formGroup]="validateForm" (ngSubmit)="submitForm()">
  <fieldset [disabled]="saving">
    <div class="mb-3">
      <label for="edit-role-code">{{'roleManager.code' | translate}}</label>
      <input id="edit-role-code" class="form-control" formControlName="code" readonly autocomplete="off">
      <small>{{'roleManager.codeHint' | translate}}</small>
    </div>
    <div class="mb-3">
      <label for="edit-role-name">{{'roleManager.displayName' | translate}}</label>
      <input id="edit-role-name" class="form-control" formControlName="name" maxlength="64">
    </div>
    <div class="mb-3">
      <label for="edit-role-description">{{'roleManager.description' | translate}}</label>
      <textarea id="edit-role-description" class="form-control" formControlName="description" maxlength="256" rows="3"></textarea>
    </div>
    @if (validateForm.invalid && validateForm.touched) { <p role="alert">{{'roleManager.invalid' | translate}}</p> }
    <p>{{'roleManager.editImpact' | translate: {count: _role?.memberCount ?? 0} }}</p>
    <button class="btn btn-primary" type="submit" [disabled]="saving">{{(saving ? 'featureAccess.saving' : 'featureAccess.save') | translate}}</button>
  </fieldset>
</form>
