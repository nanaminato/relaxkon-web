<div class="screen-content w-100 h-100">
  @if (!isCompact() || visible()) {
    @if (isCompact()) { <button class="menu-backdrop" (click)="hideMenu()" [attr.aria-label]="'workspace.closeNavigation' | translate"></button> }
    <aside class="app-sidebar d-flex flex-column h-100" [class.rail-only]="!visible()" [attr.aria-label]="'workspace.conversationNavigation' | translate">
      <app-workspace-sidebar sectionTitle="universal.aiChat" [collapsed]="!visible()">
        <div class="history-area">
          @defer (on immediate) { <app-chat-history /> } @placeholder { <nz-skeleton /> }
        </div>
      </app-workspace-sidebar>
    </aside>
  }
  <main class="main-pane"><router-outlet id="main-content"></router-outlet></main>
</div>
