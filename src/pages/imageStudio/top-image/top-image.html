<div class="d-flex flex-row w-100 h-100" style="position: relative;">
  @if(!isCompact() || visible()){
    @if(isCompact()){
      <button class="menu-backdrop" type="button" [attr.aria-label]="'studio.shared.menu' | translate" (click)="hideMenu()"></button>
    }
    <div class="d-flex flex-column h-100 menu" [class.w-100]="!isCompact()" [class.menu-overlay]="isCompact()" [class.rail-only]="!visible()">
      <app-workspace-sidebar sectionTitle="universal.image-studio" [collapsed]="!visible()">
        <nav class="workspace-links studio-section-nav" [attr.aria-label]="'universal.image-studio' | translate">
          <p class="workspace-nav-caption">{{'universal.image-studio' | translate}}</p>
          <a (click)="closeMenuIfCompact()" routerLinkActive="nav-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/image-studio/gpt-image']">{{'workspace.openaiImage' | translate}}</a>
          <a (click)="closeMenuIfCompact()" routerLinkActive="nav-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/image-studio/APIMart-image']">{{'studio.image.apimart.nav' | translate}}</a>
          <a (click)="closeMenuIfCompact()" routerLinkActive="nav-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/image-studio/task-lib']">{{'universal.storeHouse'| translate}}</a>
        </nav>
      </app-workspace-sidebar>
    </div>
  }
  <div style="flex: 1 1 auto; min-width:0; overflow: hidden;">
    <router-outlet id="main-content"></router-outlet>
  </div>
</div>
