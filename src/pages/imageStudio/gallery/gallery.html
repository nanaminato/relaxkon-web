<div class="image-gallery w-100 h-100 overflow-auto">
  @if(loading){
    <div class="rounded-3 m-2 d-flex flex-row border-1 p-2">
      {{'image.running' | translate}}
      <nz-spin nzSimple></nz-spin>
    </div>
  }
  @if(!loading && !images?.length){<div class="studio-empty"><span class="empty-art" aria-hidden="true">✧</span><h3>{{ 'studioUi.imageEmpty' | translate }}</h3><p>{{ 'studioUi.imageEmptyHint' | translate }}</p></div>}
  <div class="w-100 d-flex flex-wrap flex-row justify-content-evenly">
    @for(image of images;track image){
      <app-landscape class="image-wrapper"
                     [ngClass]="{'full-width': images!.length === 1}"
                     [loading]="loading" [src]="image.image_url" ></app-landscape>
    }
  </div>

</div>
