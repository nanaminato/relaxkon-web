<article class="chat-box" [class.user-turn]="isUser" [attr.aria-label]="getHeadName(chatModel)">
  <div class="dialogue-identity">
    @if (!isUser) {
      <img nz-image [ngSrc]="getIcon(chatModel?.role)" [nzFallback]="'assets/svgs/programmer.png'" width="24" height="24" alt=""/>
    }
    <span class="dialogue-name">{{getHeadName(chatModel)}}</span>
    @if (active) {
      <span class="active" nz-tooltip [nzTooltipTitle]="'chat.message.inContext' | translate"
            role="img" [attr.aria-label]="'chat.message.inContext' | translate"></span>
    }
  </div>
  <div class="dialogue-content" [style]="getFontSize()">
    <app-chat [chatModel]="chatModel"></app-chat>
  </div>
  <div class="dialogue-actions">
    @if (chatModel?.content) {
      <button type="button" nz-button nz-tooltip (click)="copyAllContent()"
              [nzTooltipTitle]="'chat.message.copyContent' | translate"
              [attr.aria-label]="'chat.message.copyContent' | translate">
        <span nz-icon nzType="copy"></span>
      </button>
    }
    <button type="button" nz-button nz-tooltip (click)="toggleActions()" [attr.aria-expanded]="actionsExpanded()"
            [nzTooltipTitle]="'workspace.moreActions' | translate" [attr.aria-label]="'workspace.moreActions' | translate">
      <span nz-icon nzType="more"></span>
    </button>
    @if (actionsExpanded()) {
      <button type="button" nz-button nz-tooltip [disabled]="busy" (click)="triggerEdit()"
              [nzTooltipTitle]="'chat.message.edit' | translate" [attr.aria-label]="'chat.message.edit' | translate">
        <span nz-icon nzType="edit"></span>
      </button>
      <button type="button" nz-button nz-tooltip [disabled]="busy" (click)="triggerStartAsContext()"
              [nzTooltipTitle]="'chat.message.startContextFromHere' | translate"
              [attr.aria-label]="'chat.message.startContextFromHere' | translate">
        <span nz-icon nzType="sort-ascending"></span>
      </button>

    }
  </div>
</article>
