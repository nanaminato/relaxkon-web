<nz-modal [(nzVisible)]="exportVisible"
          [nzTitle]="'prompts.exportSystemPreset' | translate"
          (nzOnCancel)="exportClose()"
          (nzOnOk)="exportClose()"
          [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <app-export-prompts></app-export-prompts>
  </ng-container>
</nz-modal>
<nz-modal [(nzVisible)]="importVisible"
          [nzTitle]="'prompts.importSystemPreset' | translate"
          (nzOnCancel)="importClose()"
          (nzOnOk)="importClose()"
          [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <app-import-prompts></app-import-prompts>
  </ng-container>
</nz-modal>
<nz-modal [(nzVisible)]="createVisible"
          [nzTitle]="'prompts.createSystemPresetInfo' | translate"
          (nzOnCancel)="createClose()"
          (nzOnOk)="createClose()"
          [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <app-create-prompt (close)="createClose()"></app-create-prompt>
  </ng-container>
</nz-modal>
<nz-modal [(nzVisible)]="lookVisible"
          [nzTitle]="'prompts.viewSystemPresetInfo' | translate"
          (nzOnCancel)="lookClose()"
          (nzOnOk)="lookClose()"
          [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <app-look-update-prompt [prompt]="lookPrompt" (close)="lookClose()"></app-look-update-prompt>
  </ng-container>
</nz-modal>
<div class="d-flex flex-column w-100 h-100 bg-theme text-theme">
  <header class="workspace-page-header">
    <button nz-button type="button" class="workspace-icon-button" (click)="toggleMenu()" [attr.aria-expanded]="menuVisible()" [attr.aria-label]="(menuVisible() ? 'workspace.closeNavigation' : 'workspace.openNavigation') | translate">
      <span nz-icon [nzType]="menuVisible() ? 'menu-fold' : 'menu-unfold'" aria-hidden="true"></span>
    </button>
    <h1>{{ 'prompts.presetManagement' | translate }}</h1>
    <button nz-button type="button" class="workspace-icon-button workspace-header-end" [routerLink]="['/chat']" [attr.aria-label]="'account.ui.backToChat' | translate">
      <span nz-icon nzType="close" aria-hidden="true"></span>
    </button>
  </header>
  <div class="prompt-content">
    <nz-card class="prompt-section">
      <div class="d-flex flex-row-reverse mb-2 prompt-actions">
        <nz-row>
          <nz-col>
            <button nz-button class="rounded-3"
                    (click)="exportVisible = true"
            >
              {{ 'prompts.export' | translate }}
            </button>
          </nz-col>
          <nz-col class="ms-2">
            <button nz-button class="rounded-3"
                    (click)="importVisible = true"
            >
              {{ 'prompts.import' | translate }}
            </button>
          </nz-col>
        </nz-row>
      </div>
      <div class="d-flex flex-row align-items-center prompt-filter">
        <input nz-input [(ngModel)]="filterText"
               (ngModelChange)="filter()"
               class="flex-grow-1 h-input" [placeholder]="'prompts.keywordSearch' | translate">
        <button (click)="createVisible = true"
                nz-button nzType="primary">
          {{'prompts.createNew' | translate}}
        </button>
      </div>
    </nz-card>
    <nz-card class="prompt-section">
      <div class="d-flex flex-row-reverse m-2">
        <div>
          <button nz-button nzDanger [disabled]="!filterPrompts.length" (click)="deleteAllFilterPrompts()">
            {{'prompts.deleteAll' | translate}}
          </button>
        </div>
      </div>
      @if (filterPrompts.length === 0) {
        <p class="prompt-empty">{{'prompts.nothing' | translate}}</p>
      }
      <div class="d-flex flex-column">
        @for (prompt of filterPrompts; track prompt.id) {
          <div class="prompt-item">
              <nz-col>
                <div>
                  {{ prompt.title }}
                </div>
                <div>
                  {{ prompt.content.substring(0, 20) }}...
                </div>
              </nz-col>
              <nz-col>
                <nz-row class="prompt-item-actions">
                  <button nz-button class="rounded-3 ms-1 mb-1"
                          (click)="lookModalOpen(prompt.id)"
                  >
                    {{'prompts.view' | translate}}
                  </button>
                  <button nz-button nzDanger class="rounded-3 ms-1 mb-1"
                          (click)="deletePrompt(prompt.id)"
                  >
                    {{'prompts.delete' | translate}}
                  </button>
                </nz-row>
              </nz-col>
          </div>
        }
      </div>
    </nz-card>
  </div>
</div>
